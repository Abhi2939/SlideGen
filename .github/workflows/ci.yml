name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-crosextra-carlito fonts-liberation2
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify production font metrics
        run: |
          python - <<'PY'
          from app.render.measure import font_metrics

          for bold in (False, True):
              face = font_metrics("Calibri", 16, bold)
              print(f"Calibri metrics (bold={bold}): {face.path}")
              assert "Carlito" in str(face.path), "CI must use the production Calibri-compatible font"
          PY
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check app tests
