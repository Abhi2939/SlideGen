services:
  - type: web
    name: slidegen
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    disk:
      name: slidegen-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LLM_TPM_LIMIT
        value: "8000"
      - key: LLM_SAFETY_MARGIN
        value: "0.85"
      - key: LLM_CONCURRENCY
        value: "1"
      - key: LLM_MAX_RETRIES
        value: "8"
      - key: LLM_WAIT_BUDGET_SECONDS
        value: "180"
      - key: LLM_FALLBACK_AFTER_SECONDS
        value: "30"
      - key: SLIDEGEN_DESIGN_PIPELINE
        value: editorial
      - key: SLIDEGEN_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: SLIDEGEN_ASSETS_ENABLED
        value: "true"
      - key: SLIDEGEN_CURATED_PHOTOS_ENABLED
        value: "true"
      - key: SLIDEGEN_ASSET_CACHE_DIR
        value: /var/data/assets
      - key: PEXELS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SLIDEGEN_TRUST_CLOUDFLARE_IP_HEADER
        value: "true"
      - key: SLIDEGEN_DATA_DIR
        value: /var/data
      - key: SLIDEGEN_MAX_JOBS
        value: "1"
      - key: SLIDEGEN_MAX_ACTIVE_JOBS
        value: "20"
      - key: SLIDEGEN_RETENTION_HOURS
        value: "24"
      - key: SLIDEGEN_JOB_TIMEOUT_SECONDS
        value: "1800"
      - key: SLIDEGEN_LLM_PROVIDER
        value: groq
      - key: SLIDEGEN_STRUCTURED_ATTEMPTS
        value: "2"
      - key: SLIDEGEN_ANALYSIS_MODEL
        value: openai/gpt-oss-20b
      - key: SLIDEGEN_OUTLINE_MODEL
        value: openai/gpt-oss-20b
      - key: SLIDEGEN_WRITING_MODEL
        value: openai/gpt-oss-120b
      - key: SLIDEGEN_REVIEW_MODEL
        value: openai/gpt-oss-20b
